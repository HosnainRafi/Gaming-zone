<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamers Den — Gaming Zone Management</title>
    <meta name="description"
        content="The ultimate gaming destination in Narayanganj. High-end RTX gaming PCs, PS5 & PS4 Pro consoles, racing sims, tournaments and more." />
    <meta name="theme-color" content="#0B0E14" />
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B9%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <!-- Apply saved theme before first paint to avoid flash (admin pages only) -->
    <script>
        (function () {
            try {
                var path = window.location.pathname;
                var adminPaths = ['/dashboard', '/devices', '/members', '/sessions', '/offers', '/reports', '/staff', '/settings'];
                if (localStorage.getItem('gz_theme') === 'light' && adminPaths.some(function (p) { return path.startsWith(p); })) {
                    document.documentElement.classList.add('light');
                }
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
